name: CI/CD — ElectionGuide AI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

env:
  PROJECT_ID: project-86a1a2a8-0a81-4297-b3d
  REGION: asia-south1
  SERVICE: electionguide-ai
  REGISTRY: asia-south1-docker.pkg.dev
  IMAGE: asia-south1-docker.pkg.dev/project-86a1a2a8-0a81-4297-b3d/electionguide-ai/electionguide-ai
  WIF_PROVIDER: projects/682699924845/locations/global/workloadIdentityPools/github-actions-pool/providers/github-provider
  WIF_SERVICE_ACCOUNT: github-actions-deploy@project-86a1a2a8-0a81-4297-b3d.iam.gserviceaccount.com

permissions:
  contents: read
  id-token: write   # Required for Workload Identity Federation

jobs:
  # ─── Quality Gates (PRs & pushes) ─────────────────────────────────────────
  quality:
    name: Quality Gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: TypeScript type check
        run: npx tsc --noEmit
        continue-on-error: true

      - name: ESLint
        run: npm run lint
        continue-on-error: true

      - name: npm audit (high severity)
        run: npm audit --audit-level=high
        continue-on-error: true

  # ─── Build & Deploy (main branch only) ────────────────────────────────────
  deploy:
    name: Build & Deploy to Cloud Run
    runs-on: ubuntu-latest
    needs: quality
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - uses: actions/checkout@v4

      # Keyless auth via Workload Identity Federation — no JSON key needed
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
          service_account: ${{ env.WIF_SERVICE_ACCOUNT }}

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker ${{ env.REGISTRY }} --quiet

      - name: Build Docker image (linux/amd64)
        run: |
          docker build \
            --platform linux/amd64 \
            --provenance=false \
            --build-arg NEXT_PUBLIC_SUPABASE_URL="${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}" \
            --build-arg NEXT_PUBLIC_SUPABASE_ANON_KEY="${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}" \
            --build-arg NEXT_PUBLIC_GOOGLE_MAPS_KEY="${{ secrets.NEXT_PUBLIC_GOOGLE_MAPS_KEY }}" \
            --build-arg NEXT_PUBLIC_APP_URL="https://electionguide-ai-cxwzmnsukq-el.a.run.app" \
            --build-arg NEXT_PUBLIC_VAPID_PUBLIC_KEY="${{ secrets.NEXT_PUBLIC_VAPID_PUBLIC_KEY }}" \
            -t ${{ env.IMAGE }}:${{ github.sha }} \
            -t ${{ env.IMAGE }}:latest \
            .

      - name: Push to Artifact Registry
        run: |
          docker push ${{ env.IMAGE }}:${{ github.sha }}
          docker push ${{ env.IMAGE }}:latest

      - name: Deploy to Cloud Run
        uses: google-github-actions/deploy-cloudrun@v2
        with:
          service: ${{ env.SERVICE }}
          region: ${{ env.REGION }}
          image: ${{ env.IMAGE }}:${{ github.sha }}
          flags: |
            --min-instances=0
            --max-instances=20
            --memory=1Gi
            --cpu=1
            --concurrency=80
            --port=3000
            --allow-unauthenticated
          env_vars: |
            NODE_ENV=production
            NEXT_TELEMETRY_DISABLED=1
          secrets: |
            SUPABASE_SERVICE_ROLE_KEY=SUPABASE_SERVICE_ROLE_KEY:latest
            GEMINI_API_KEY=GEMINI_API_KEY:latest
            GOOGLE_MAPS_API_KEY=NEXT_PUBLIC_GOOGLE_MAPS_KEY:latest
            CRON_SECRET=CRON_SECRET:latest
            VAPID_PRIVATE_KEY=VAPID_PRIVATE_KEY:latest

      - name: Health check (5 retries)
        run: |
          URL="https://electionguide-ai-cxwzmnsukq-el.a.run.app"
          for i in 1 2 3 4 5; do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" "$URL/api/health")
            echo "Attempt $i: HTTP $STATUS"
            if [ "$STATUS" = "200" ]; then
              echo "Health check passed!"
              exit 0
            fi
            sleep 15
          done
          echo "Health check failed — rolling back"
          gcloud run services update-traffic ${{ env.SERVICE }} \
            --region=${{ env.REGION }} \
            --to-revisions=PREVIOUS=100 \
            --quiet
          exit 1

      - name: Deployment summary
        if: success()
        run: |
          echo "Deployed: ${{ github.sha }}"
          echo "URL: https://electionguide-ai-cxwzmnsukq-el.a.run.app"
          echo "Commit: ${{ github.event.head_commit.message }}"
